<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PanelFlow</title>
  <!-- Palette first: styles.css only names tokens, it declares no colour. -->
  <link rel="stylesheet" href="shared/theme.css">
  <!-- Not deferred: the choice has to be on <html> before the first paint. -->
  <script src="shared/theme.js"></script>
  <!-- The same argument, for the same reason: `apply()` fills markup that ships
       empty, so a catalogue that arrives a round-trip late is a screen of blank
       labels. Generated from shared/_locales/ — see scripts/build-messages.mjs. -->
  <script src="messages.js"></script>
  <script src="shared/i18n.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- The icon set, defined once and stamped with <use>. Emoji were doing this
       job before, and an emoji is a different picture on every platform, sits
       on its own baseline, and cannot take the colour of the text beside it.
       These are 24x24 line drawings that inherit both, so a button gets its
       icon in whatever colour the button is. -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <!-- Three panels of a page: the mark is the product's name. -->
    <symbol id="i-mark" viewBox="0 0 24 24"><path d="M3 4h18v16H3zM10 4v16M10 12h11"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.3-5.7M20 4v4h-4"/></symbol>
    <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 4v9m0 0l-3.5-3.5M12 13l3.5-3.5M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></symbol>
    <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 14V5m0 0L8.5 8.5M12 5l3.5 3.5M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M4 9h13m0 0l-3.5-3.5M17 9l-3.5 3.5M20 15H7m0 0l3.5-3.5M7 15l3.5 3.5"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 00-3-3L5 17z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6M10 20a2 2 0 004 0"/></symbol>
    <symbol id="i-bell-off" viewBox="0 0 24 24"><path d="M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6M10 20a2 2 0 004 0M4 4l16 16"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><path d="M3 6h18v12H3zM3 7l9 6 9-6"/></symbol>
  </svg>

  <!-- Auth -->
  <div id="auth-view" hidden>
    <form id="auth-form" class="auth-card">
      <h1><svg class="ico" aria-hidden="true"><use href="#i-mark"/></svg> PanelFlow</h1>
      <p class="tagline" data-i18n="webTagline"></p>
      <label><span data-i18n="fieldEmail"></span>
        <input type="email" id="auth-email" required autocomplete="email">
      </label>
      <label><span data-i18n="fieldPassword"></span>
        <input type="password" id="auth-password" required minlength="8" autocomplete="current-password">
      </label>
      <p id="auth-error" class="error" hidden></p>
      <!-- Not annotated: app.js swaps this between two sentences as the form
           changes mode, so it is filled from the same place the swap is. -->
      <button type="submit" id="auth-submit" data-mode="login"></button>
      <p class="switch">
        <span id="auth-switch-label"></span>
        <a href="#" id="auth-switch"></a>
      </p>
      <!-- Hidden while the form is in create-account mode: there is nothing to
           have forgotten yet. Hidden to begin with too — it is drawn only once
           the server has said it can actually send the mail. -->
      <p class="switch" id="auth-forgot-line" hidden>
        <a href="#" id="auth-forgot" data-i18n="actionForgotPassword"></a>
      </p>
    </form>

    <!-- Asking for a link. Its own form so the address can be typed here
         without carrying whatever was half-typed into the sign-in one. -->
    <form id="forgot-form" class="auth-card" hidden>
      <h1><svg class="ico" aria-hidden="true"><use href="#i-mark"/></svg> PanelFlow</h1>
      <p class="tagline" data-i18n="webForgotLede"></p>
      <label><span data-i18n="fieldEmail"></span>
        <input type="email" id="forgot-email" required autocomplete="email">
      </label>
      <p id="forgot-error" class="error" hidden></p>
      <p id="forgot-sent" class="notice" hidden></p>
      <button type="submit" id="forgot-submit" data-i18n="webSendTheLink"></button>
      <p class="switch"><a href="#" id="forgot-back" data-i18n="webBackToSignIn"></a></p>
    </form>

    <!-- Spending the link. Shown only when the page was opened with one. -->
    <form id="reset-form" class="auth-card" hidden>
      <h1><svg class="ico" aria-hidden="true"><use href="#i-mark"/></svg> PanelFlow</h1>
      <p class="tagline" data-i18n="webResetLede"></p>
      <label><span data-i18n="webNewPassword"></span>
        <input type="password" id="reset-password" required minlength="8" autocomplete="new-password">
      </label>
      <p id="reset-error" class="error" hidden></p>
      <button type="submit" id="reset-submit" data-i18n="webChangePassword"></button>
      <p class="switch"><a href="#" id="reset-back" data-i18n="webBackToSignIn"></a></p>
    </form>
  </div>

  <!-- App -->
  <div id="app-view" hidden>
    <!-- The title row and the view tabs stick together, as one block. They used
         to stick separately, which meant the tab row's offset was the header's
         height written out as a number — a number that is wrong the moment the
         header wraps, which on a phone it does. -->
    <div class="topbar">
      <header>
        <div class="brand"><svg class="ico" aria-hidden="true"><use href="#i-mark"/></svg> <span>PanelFlow</span></div>
        <input type="search" id="search" data-i18n-placeholder="searchLibrary">
        <div class="account">
          <span id="account-email"></span>
          <!-- Hidden until the server turns out to have push keys and the browser
               turns out to support any of this. Its icon is set in app.js: the
               bell is ringing or crossed out, and that is the whole state. -->
          <button id="push-toggle" class="icon-btn" hidden></button>
          <!-- And this one only once alerts are actually on: it exists to answer
               "did that work?", which has no answer while they are off. -->
          <button id="push-test" class="icon-btn" hidden data-i18n-title="webPushTest"><svg class="ico" aria-hidden="true"><use href="#i-mail"/></svg></button>
          <button id="logout" data-i18n-title="actionSignOut" data-i18n="actionSignOut"></button>
        </div>
      </header>

      <nav id="views">
        <button class="view-tab active" data-view="library" data-i18n="navLibrary"></button>
        <!-- The count is the reason this tab is second rather than last: it is
             the only one that ever has something to say before you click it. -->
        <button class="view-tab" data-view="updates"><span data-i18n="navUpdates"></span><span class="count" id="updates-count" hidden></span></button>
        <button class="view-tab" data-view="stats" data-i18n="navStatistics"></button>
        <button class="view-tab" data-view="history" data-i18n="navHistory"></button>
        <button class="view-tab" data-view="trackers" data-i18n="navTrackers"></button>
        <button class="view-tab" data-view="settings" data-i18n="navSettings"></button>
      </nav>
    </div>

    <!-- Every dialog on this page has its own error line; the shelf had none,
         so a request that failed on the way in left a blank screen that said
         nothing and offered nothing. This is that line, plus the one button
         worth having when a request fails: the same request again. -->
    <div id="app-error" class="app-error" hidden>
      <span id="app-error-text"></span>
      <button id="app-error-retry" type="button" data-i18n="webTryAgain"></button>
    </div>

    <main>
      <div id="library-view">
        <section id="continue-section" hidden>
          <h2 data-i18n="libraryContinueReading"></h2>
          <div id="continue-list" class="shelf"></div>
        </section>

        <section>
          <div class="library-head">
            <h2 data-i18n="navLibrary"></h2>
            <!-- Wraps rather than shrinking: four buttons do not fit across a
                 phone, and a row that shrinks instead cuts the labels off —
                 which is the part of a button worth keeping. -->
            <div class="library-actions">
              <button id="import-open" data-i18n-title="webImportTitle"><svg class="ico" aria-hidden="true"><use href="#i-import"/></svg> <span data-i18n="webImport"></span></button>
              <button id="export-open" data-i18n-title="webExportTitle"><svg class="ico" aria-hidden="true"><use href="#i-export"/></svg> <span data-i18n="webExport"></span></button>
              <button id="migrate-open" data-i18n-title="webMoveSiteTitle"><svg class="ico" aria-hidden="true"><use href="#i-move"/></svg> <span data-i18n="webMoveSite"></span></button>
              <button id="add-series" class="primary"><svg class="ico" aria-hidden="true"><use href="#i-plus"/></svg> <span data-i18n="webAddSeries"></span></button>
            </div>
          </div>
          <!-- Built from PanelFlowFolders.folderTabs(): the five built-in
               folders, then whatever shelves this account has invented. -->
          <nav id="tabs"></nav>
          <!-- Order and narrowing. The tags come from the library itself, so
               this row is as long as the shelf below it deserves. -->
          <div id="library-tools">
            <label class="tool"><span data-i18n="webSort"></span>
              <select id="sort"></select>
            </label>
            <button id="sort-dir" class="tool-btn" data-i18n-title="actionReverseOrder"></button>
            <label class="tool check">
              <input type="checkbox" id="unread-only"> <span data-i18n="webUnreadOnly"></span>
            </label>
            <div id="tag-filter" class="tag-filter"></div>
            <span id="library-count" class="muted-note"></span>
          </div>
          <div id="library-grid" class="grid"></div>
          <p id="empty" data-i18n="webLibraryEmpty" hidden></p>
        </section>
      </div>

      <!-- What is out that you have not read. One line per series, and every
           line opens the chapter rather than the series page — landing on a
           front page and hunting for the chapter you were told about is the
           step this view exists to remove. -->
      <div id="updates-view" hidden>
        <section>
          <div class="library-head">
            <h2 data-i18n="webNewChapters"></h2>
            <!-- The check moved here out of the library toolbar. It is the
                 action that fills this list, and it belongs above the list it
                 fills rather than fifth along a row somewhere else. The class
                 is the toolbar row's style, not a claim about the library. -->
            <div class="library-actions">
              <!-- Empty until something is checked, so it is styled to take up
                   no room at all until then; once it speaks, it takes the whole
                   first line on a phone rather than squeezing the button. -->
              <span id="check-status" role="status" aria-live="polite"></span>
              <button id="check-updates" data-i18n-title="webCheckUpdatesTitle"><svg class="ico" aria-hidden="true"><use href="#i-refresh"/></svg> <span data-i18n="actionCheckNow"></span></button>
            </div>
          </div>
          <div id="updates-list" class="feed"></div>
          <!-- Quiet when there is nothing, because there is nothing wrong with
               being caught up and this view is where the app lands. -->
          <p id="updates-empty" class="muted-note" data-i18n="webUpdatesEmpty" hidden></p>
        </section>
      </div>

      <div id="stats-view" hidden>
        <section>
          <h2 data-i18n="webReadingStatistics"></h2>
          <div id="stat-cards" class="stat-cards"></div>
        </section>
        <section>
          <h2 data-i18n="statsLast30Days"></h2>
          <div id="stat-chart" class="chart"></div>
          <p id="stat-empty" class="muted-note" data-i18n="webStatsEmpty" hidden></p>
        </section>
        <section>
          <h2 data-i18n="statsMostRead"></h2>
          <ol id="stat-top" class="top-list"></ol>
        </section>
        <section>
          <h2 data-i18n="webLibraryBreakdown"></h2>
          <div id="stat-folders" class="folder-bars"></div>
        </section>
      </div>

      <div id="history-view" hidden>
        <section>
          <div class="library-head">
            <h2 data-i18n="webReadingHistory"></h2>
            <div class="library-actions">
              <button id="history-clear" data-i18n-title="webClearHistoryTitle" data-i18n="webClearHistory"></button>
            </div>
          </div>
          <div id="history-list" class="history"></div>
          <p id="history-empty" class="muted-note" data-i18n="statsNothingRead" hidden></p>
        </section>
      </div>

      <div id="trackers-view" hidden>
        <section>
          <div class="library-head">
            <h2 data-i18n="webConnectedAccounts"></h2>
            <div class="library-actions">
              <span id="tracker-status" class="muted-note"></span>
            </div>
          </div>
          <p class="muted-note" data-i18n="webTrackersLede"></p>
          <div id="tracker-accounts" class="tracker-accounts"></div>
        </section>
        <section>
          <div class="library-head">
            <h2 data-i18n="trackerLinkedSeries"></h2>
          </div>
          <div id="tracker-links" class="tracker-links"></div>
          <p id="tracker-links-empty" class="muted-note" data-i18n="webNoLinksYet" hidden></p>
        </section>
      </div>

      <!-- Settings. Two halves, because they are kept in two different places:
           the account is on the server and follows you between browsers, and
           everything under Reading lives in the extension on this machine —
           reached through the bridge it injects into this page. -->
      <div id="settings-view" hidden>
        <!-- First, and outside the extension's half on purpose: this one is
             this page's own and is the only setting here that still works with
             no extension. It reaches the account directly rather than through
             the extension, because it has to work in a browser that has never
             had the extension in it. -->
        <section>
          <h2 data-i18n="webAppearance"></h2>
          <div class="setting">
            <div class="setting-label"><span data-i18n="optionsTheme"></span>
              <p class="muted-note" data-i18n="webThemeHint"></p>
            </div>
            <select id="set-theme">
              <option value="system" data-i18n="optionsThemeSystem"></option>
              <option value="light" data-i18n="optionsThemeLight"></option>
              <option value="dark" data-i18n="optionsThemeDark"></option>
            </select>
          </div>
          <!-- Beside the theme, and outside the extension's half below, because
               it is the same kind of answer: an account preference this page has
               to obey itself. It used to sit under Reading, where it was only
               reachable with the extension installed and only ever changed the
               extension — the website went on being English either way. -->
          <div class="setting">
            <div class="setting-label"><span data-i18n="optionsUiLanguage"></span>
              <p class="muted-note" data-i18n="webLanguageHint"></p>
            </div>
            <select id="set-lang">
              <option value="auto" data-i18n="optionsLanguageAuto"></option>
              <option value="en">English</option>
              <option value="fr">Français</option>
            </select>
          </div>
        </section>

        <section>
          <h2 data-i18n="navAccount"></h2>
          <div class="setting">
            <div class="setting-label"><span data-i18n="signedInAs"></span> <b id="set-email"></b>
              <p class="muted-note" data-i18n="webAccountHint"></p>
            </div>
            <button id="set-signout" data-i18n="actionSignOut"></button>
          </div>
          <div class="setting">
            <div class="setting-label"><span data-i18n="fieldPassword"></span>
              <p class="muted-note" data-i18n="webPasswordHint"></p>
            </div>
            <button id="set-password" data-i18n="webEmailMeALink"></button>
          </div>
          <p id="set-account-msg" class="notice" hidden></p>
        </section>

        <section>
          <div class="library-head">
            <h2 data-i18n="webReading"></h2>
            <div class="library-actions"><span id="set-status" class="muted-note"></span></div>
          </div>
          <!-- Shown when the extension is not in this browser: these settings
               have nowhere to be written, and controls that save nothing are
               worse than an explanation. -->
          <p id="set-no-extension" class="muted-note" data-i18n="webNoExtension" hidden></p>
          <div id="set-extension" hidden>
            <div class="setting">
              <div class="setting-label"><span data-i18n="optionsDefaultMode"></span>
                <p class="muted-note" data-i18n="webReadingDirectionHint"></p>
              </div>
              <select id="set-mode">
                <option value="vertical" data-i18n="modeVertical"></option>
                <option value="ltr" data-i18n="modeLtr"></option>
                <option value="rtl" data-i18n="modeRtl"></option>
                <option value="spread" data-i18n="modeSpread"></option>
                <option value="spread-rtl" data-i18n="modeSpreadRtl"></option>
              </select>
            </div>
            <label class="setting check">
              <input type="checkbox" id="set-autoshow">
              <span class="setting-label" data-i18n="optionsAutoShow"></span>
            </label>
            <label class="setting check">
              <input type="checkbox" id="set-autonext">
              <span class="setting-label" data-i18n="optionsAutoNext"></span>
            </label>
            <label class="setting check">
              <input type="checkbox" id="set-hideread">
              <span class="setting-label" data-i18n="optionsHideRead"></span>
            </label>
            <label class="setting check">
              <input type="checkbox" id="set-readerdark">
              <span class="setting-label" data-i18n="optionsReaderDark"></span>
            </label>
            <div class="setting">
              <div class="setting-label"><span data-i18n="optionsTapZones"></span>
                <p class="muted-note" data-i18n="optionsTapHint"></p>
              </div>
              <select id="set-tapzones">
                <option value="sides" data-i18n="optionsTapSides"></option>
                <option value="edges" data-i18n="optionsTapEdges"></option>
                <option value="off" data-i18n="optionsTapOff"></option>
              </select>
            </div>
            <div class="setting">
              <div class="setting-label"><span data-i18n="optionsCheckEvery"></span>
                <p class="muted-note" data-i18n="webCheckEveryHint"></p>
              </div>
              <select id="set-interval">
                <option value="60" data-i18n="optionsEvery1h"></option>
                <option value="180" data-i18n="optionsEvery3h"></option>
                <option value="360" data-i18n="optionsEvery6h"></option>
                <option value="720" data-i18n="optionsEvery12h"></option>
                <option value="1440" data-i18n="optionsEvery24h"></option>
              </select>
            </div>
            <div class="setting stacked">
              <div class="setting-label"><span data-i18n="webWhitelist"></span>
                <p class="muted-note" data-i18n="webWhitelistHint"></p>
              </div>
              <textarea id="set-whitelist" rows="3" placeholder="example.com"></textarea>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- Add / edit series dialog -->
  <dialog id="series-dialog">
    <form id="series-form" method="dialog">
      <h2 id="dialog-title"></h2>
      <label><span data-i18n="webFieldTitle"></span>
        <input id="f-title" required placeholder="One Piece">
      </label>
      <label><span data-i18n="webFieldSeriesUrl"></span>
        <input id="f-url" type="url" required placeholder="https://example.com/manga/one-piece">
      </label>
      <p id="f-scrape-status" class="scrape-status" hidden></p>
      <label><span data-i18n="webFieldCoverUrl"></span> <span class="opt" data-i18n="webFieldCoverHint"></span>
        <input id="f-cover" type="url" placeholder="https://…/cover.jpg">
      </label>
      <img id="f-cover-preview" class="cover-preview" alt="" hidden>
      <div class="field-row">
        <!-- Options built in app.js, same list as the tab row. -->
        <label><span data-i18n="webFieldStatus"></span>
          <select id="f-status"></select>
        </label>
        <label><span data-i18n="fieldScore"></span> <span class="opt">(1–10)</span>
          <input id="f-score" type="number" min="1" max="10" step="1" placeholder="—">
        </label>
      </div>
      <div class="field-row">
        <label><span data-i18n="fieldLanguage"></span>
          <select id="f-language">
            <option value="">—</option>
            <option value="ja" data-i18n="webLangJa"></option>
            <option value="ko" data-i18n="webLangKo"></option>
            <option value="zh" data-i18n="webLangZh"></option>
            <option value="en" data-i18n="webLangEn"></option>
            <option value="fr" data-i18n="webLangFr"></option>
            <option value="es" data-i18n="webLangEs"></option>
          </select>
        </label>
        <label><span data-i18n="webFieldPublication"></span>
          <select id="f-series-status">
            <option value="">—</option>
            <option value="ongoing" data-i18n="webOngoing"></option>
            <option value="completed" data-i18n="webFinished"></option>
          </select>
        </label>
      </div>
      <div class="field-row">
        <label><span data-i18n="webStarted"></span>
          <input id="f-start" type="date">
        </label>
        <label><span data-i18n="webFinished"></span>
          <input id="f-finish" type="date">
        </label>
        <label><span data-i18n="fieldRereads"></span>
          <input id="f-rereads" type="number" min="0" max="9999" step="1" placeholder="0">
        </label>
      </div>
      <label><span data-i18n="fieldTags"></span> <span class="opt" data-i18n="webCommaSeparated"></span>
        <input id="f-tags" data-i18n-placeholder="webTagsPlaceholder">
      </label>
      <label><span data-i18n="fieldNote"></span>
        <textarea id="f-note" rows="2" data-i18n-placeholder="webNotePlaceholder"></textarea>
      </label>
      <p id="dialog-error" class="error" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="dialog-cancel" data-i18n="actionCancel"></button>
        <button type="submit" class="primary" id="dialog-save" data-i18n="actionSave"></button>
      </div>
    </form>
  </dialog>

  <!-- Manual progress dialog (auto-saved by the extension's Reader Mode; this
       lets you set or fix it from the web app) -->
  <dialog id="progress-dialog">
    <form id="progress-form" method="dialog">
      <h2 data-i18n="webReadingProgress"></h2>
      <label><span data-i18n="webFieldChapter"></span>
        <input id="p-chapter" data-i18n-placeholder="webChapterPlaceholder">
      </label>
      <label><span data-i18n="webFieldPage"></span>
        <input id="p-page" type="number" min="1" value="1">
      </label>
      <label><span data-i18n="webFieldChapterUrl"></span>
        <input id="p-url" type="url" required placeholder="https://…/chapter-42">
      </label>
      <p id="p-error" class="error" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="p-cancel" data-i18n="actionCancel"></button>
        <button type="submit" class="primary" data-i18n="actionSave"></button>
      </div>
    </form>
  </dialog>

  <!-- Import a list from a tracker. Always previewed before it is run: an
       import writes across the whole library at once. -->
  <dialog id="import-dialog">
    <form id="import-form" method="dialog">
      <h2 data-i18n="webImportList"></h2>
      <p class="muted-note" data-i18n="webImportLede"></p>
      <!-- A connected account needs neither a username nor a file: the server
           already holds a token for it. Hidden entirely when there is none. -->
      <div id="i-accounts" hidden>
        <p class="muted-note" data-i18n="webFromConnected"></p>
        <div id="i-account-list" class="import-accounts"></div>
        <p class="or" data-i18n="webOr"></p>
      </div>
      <label><span data-i18n="webAnilistUsername"></span>
        <input id="i-anilist" data-i18n-placeholder="webYourName">
      </label>
      <p class="or" data-i18n="webOr"></p>
      <label><span data-i18n="webMalExport"></span> <span class="opt" data-i18n="webMalExportHint"></span>
        <input id="i-mal" type="file" accept=".xml,text/xml,application/xml,.gz">
      </label>
      <p id="i-status" class="muted-note" hidden></p>
      <div id="i-report" class="report" hidden></div>
      <p id="i-error" class="error" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="i-cancel" data-i18n="webClose"></button>
        <button type="submit" id="i-preview" data-i18n="webPreview"></button>
        <button type="button" class="primary" id="i-run" hidden data-i18n="webImport"></button>
      </div>
    </form>
  </dialog>

  <!-- Getting the library back out: a backup that can be restored, and two
       formats for taking it somewhere else. -->
  <dialog id="export-dialog">
    <form id="export-form" method="dialog">
      <h2 data-i18n="webExport"></h2>
      <p class="muted-note" data-i18n="webExportLede"></p>
      <div class="export-choices">
        <button type="button" id="x-json" class="primary"><svg class="ico" aria-hidden="true"><use href="#i-export"/></svg> <span data-i18n="webBackupJson"></span></button>
        <button type="button" id="x-mal"><svg class="ico" aria-hidden="true"><use href="#i-export"/></svg> MyAnimeList (.xml)</button>
        <button type="button" id="x-csv"><svg class="ico" aria-hidden="true"><use href="#i-export"/></svg> <span data-i18n="webSpreadsheetCsv"></span></button>
      </div>
      <h3 data-i18n="webRestoreBackup"></h3>
      <p class="muted-note" data-i18n="webRestoreLede"></p>
      <label><span data-i18n="webPanelflowBackup"></span> <span class="opt" data-i18n="webPanelflowBackupHint"></span>
        <input id="x-file" type="file" accept=".json,application/json">
      </label>
      <p id="x-status" class="muted-note" hidden></p>
      <div id="x-report" class="report" hidden></div>
      <p id="x-error" class="error" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="x-cancel" data-i18n="webClose"></button>
        <button type="submit" id="x-preview" data-i18n="webPreviewRestore"></button>
        <button type="button" class="primary" id="x-run" hidden data-i18n="webRestore"></button>
      </div>
    </form>
  </dialog>

  <!-- Bulk migration: a scan site dies, and every series on it has to move. -->
  <dialog id="migrate-dialog">
    <form id="migrate-form" method="dialog">
      <h2 data-i18n="webMoveWholeSite"></h2>
      <label><span data-i18n="webLeaving"></span>
        <select id="m-from"></select>
      </label>
      <label><span data-i18n="webGoingTo"></span> <span class="opt" data-i18n="webGoingToHint"></span>
        <input id="m-to" placeholder="new-scan.example">
      </label>
      <p id="m-status" class="muted-note" hidden></p>
      <div id="m-plan" class="plan" hidden></div>
      <p id="m-error" class="error" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="m-cancel" data-i18n="webClose"></button>
        <button type="submit" id="m-search" data-i18n="webFindMatches"></button>
        <button type="button" class="primary" id="m-run" hidden data-i18n="webMoveSelected"></button>
      </div>
    </form>
  </dialog>

  <!-- Shelves of the user's own, beyond the five built-in folders. -->
  <dialog id="shelves-dialog">
    <form id="shelves-form" method="dialog">
      <h2 data-i18n="webYourShelves"></h2>
      <p class="muted-note" data-i18n="webShelvesLede"></p>
      <div id="sh-list"></div>
      <div class="shelf-add">
        <input id="sh-name" data-i18n-placeholder="webNewShelfPlaceholder" maxlength="40">
        <select id="sh-status"></select>
        <button type="button" id="sh-add" class="primary" data-i18n="webAdd"></button>
      </div>
      <p id="sh-error" class="error" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="sh-close" data-i18n="webClose"></button>
      </div>
    </form>
  </dialog>

  <!-- Picking the right series on a tracker, when the automatic match was not
       sure enough to take. -->
  <dialog id="link-dialog">
    <form id="link-form" method="dialog">
      <h2 id="l-title" data-i18n="trackerFindOnTracker"></h2>
      <p id="l-sub" class="muted-note"></p>
      <label><span data-i18n="actionSearch"></span>
        <input id="l-query" placeholder="One Piece" autocomplete="off">
      </label>
      <p id="l-status" class="muted-note" hidden></p>
      <p id="l-error" class="error" hidden></p>
      <div id="l-results" class="link-results"></div>
      <div class="dialog-actions">
        <button type="button" id="l-cancel" data-i18n="webClose"></button>
        <button type="button" id="l-mute" data-i18n="trackerNeverSend"></button>
        <button type="submit" class="primary" id="l-search" data-i18n="actionSearch"></button>
      </div>
    </form>
  </dialog>

  <!-- Generated from shared/. library-view.js is the one rule that decides the
       order and the contents of a shelf; folders.js is the one rule that says
       what a folder means — both here and in the extension. -->
  <script src="shared/folders.js"></script>
  <script src="shared/library-view.js"></script>
  <script src="app.js"></script>
</body>
</html>
