<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- The one node that keeps its English: the browser paints the tab title
       before any script runs, so an empty one is a tab labelled with a URL. -->
  <title data-i18n="welcomeDocTitle">Welcome to PanelFlow</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <!-- Not deferred: the choice has to be on <html> before the first paint. -->
  <script src="../shared/theme.js"></script>
  <link rel="stylesheet" href="welcome.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="../icons/icon48.png" alt="" width="26" height="26">
      <span>PanelFlow</span>
    </div>
    <!-- Not a skip any more. The account is required, so this appears only
         when the server could not be reached at all — otherwise a backend
         that is down would leave someone with a tab they cannot leave and an
         extension they cannot set up. -->
    <button id="skip" class="link" data-i18n="welcomeSkip" hidden></button>
  </header>

  <!-- Four dots, not a percentage: the point is that this is short. -->
  <ol class="dots" id="dots">
    <li data-step="0"></li>
    <li data-step="1"></li>
    <li data-step="2"></li>
    <li data-step="3"></li>
  </ol>

  <main>

    <!-- 1 ------------------------------------------------------------------ -->
    <section class="step" data-step="0">
      <h1 data-i18n="welcomeStep1Title"></h1>
      <p class="lede" data-i18n="welcomeStep1Lede"></p>

      <!-- Drawn rather than screenshotted: a screenshot of Chrome's toolbar goes
           stale with the next Chrome redesign, and would ship a bitmap of a UI
           we do not control. -->
      <div class="figure" aria-hidden="true">
        <div class="toolbar">
          <span class="omnibox"></span>
          <span class="puzzle">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M10 4a2 2 0 114 0v1h3a1 1 0 011 1v3h1a2 2 0 110 4h-1v3a1 1 0 01-1 1h-3v-1a2 2 0 10-4 0v1H6a1 1 0 01-1-1v-3H4a2 2 0 110-4h1V6a1 1 0 011-1h4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </span>
        </div>
        <div class="sheet">
          <div class="sheet-row">
            <img src="../icons/icon48.png" alt="" width="18" height="18">
            <span>PanelFlow</span>
            <svg class="pin" viewBox="0 0 24 24" width="16" height="16"><path d="M9 3h6l-1 6 4 3v2h-5v7l-1 1-1-1v-7H6v-2l4-3z" fill="currentColor"/></svg>
          </div>
        </div>
      </div>

      <p class="hint" data-i18n-html="welcomeStep1Hint"></p>

      <!-- The theme, on the first page, because it is the one answer whose
           effect is the page asking the question: the tour repaints under the
           click, which says more about what these three words mean than any
           preview swatch could. The swatches are there anyway, for the choice
           that is not showing. -->
      <h2 data-i18n="welcomeThemeTitle"></h2>
      <div class="themes" id="theme-choices">
        <button class="choice theme" data-theme-choice="system" aria-pressed="false">
          <span class="swatch system" aria-hidden="true"></span>
          <strong data-i18n="optionsThemeSystem"></strong>
        </button>
        <button class="choice theme" data-theme-choice="light" aria-pressed="false">
          <span class="swatch light" aria-hidden="true"></span>
          <strong data-i18n="optionsThemeLight"></strong>
        </button>
        <button class="choice theme" data-theme-choice="dark" aria-pressed="false">
          <span class="swatch dark" aria-hidden="true"></span>
          <strong data-i18n="optionsThemeDark"></strong>
        </button>
      </div>
      <p class="hint" data-i18n="welcomeThemeHint"></p>

      <div class="actions">
        <span></span>
        <button class="primary" data-go="1" data-i18n="welcomeStep1Next"></button>
      </div>
    </section>

    <!-- 2 ------------------------------------------------------------------ -->
    <section class="step" data-step="1" hidden>
      <h1 data-i18n="welcomeStep2Title"></h1>
      <p class="lede" data-i18n="welcomeStep2Lede"></p>

      <div class="choices" id="auto-choices">
        <button class="choice" data-auto="on">
          <strong data-i18n="welcomeAutoOnTitle"></strong>
          <span data-i18n="welcomeAutoOnBody"></span>
        </button>
        <button class="choice" data-auto="off">
          <strong data-i18n="welcomeAutoOffTitle"></strong>
          <span data-i18n-html="welcomeAutoOffBody"></span>
        </button>
      </div>

      <label class="field"><span data-i18n="welcomeDirectionLabel"></span>
        <select id="readerMode">
          <option value="vertical" data-i18n="welcomeModeVertical"></option>
          <option value="ltr" data-i18n="welcomeModeLtr"></option>
          <option value="rtl" data-i18n="welcomeModeRtl"></option>
          <option value="spread" data-i18n="welcomeModeSpread"></option>
          <option value="spread-rtl" data-i18n="welcomeModeSpreadRtl"></option>
        </select>
      </label>
      <p class="hint" data-i18n="welcomeDirectionHint"></p>

      <div class="actions">
        <button class="ghost" data-go="0" data-i18n="actionBack"></button>
        <button class="primary" data-go="2" data-i18n="actionNext"></button>
      </div>
    </section>

    <!-- 3 ------------------------------------------------------------------ -->
    <section class="step" data-step="2" hidden>
      <h1 data-i18n="welcomeStep3Title"></h1>
      <p class="lede" data-i18n="welcomeStep3Lede1"></p>
      <p class="lede" data-i18n="welcomeStep3Lede2"></p>

      <div class="auth" id="auth-form">
        <label class="field"><span data-i18n="fieldEmail"></span> <input id="email" type="email" autocomplete="username"></label>
        <label class="field"><span data-i18n="fieldPassword"></span> <input id="password" type="password" autocomplete="new-password"></label>
        <div class="auth-buttons">
          <button class="primary" id="register" data-i18n="actionCreateAccount"></button>
          <button class="ghost" id="login" data-i18n="welcomeHaveAccount"></button>
        </div>
        <p class="hint" id="auth-msg" role="status"></p>
      </div>

      <div class="auth-done" id="auth-done" hidden>
        <p><span data-i18n="signedInAs"></span> <b id="who"></b><span data-i18n="welcomeLibraryFollows"></span></p>
      </div>

      <div class="actions">
        <button class="ghost" data-go="1" data-i18n="actionBack"></button>
        <!-- Disabled until there is an account. This is the one step the tour
             does not let you walk past. -->
        <button class="primary" data-go="3" id="account-next" data-i18n="actionNext" disabled></button>
      </div>
    </section>

    <!-- 4 ------------------------------------------------------------------ -->
    <!-- No list of sites here, on purpose. PanelFlow has no catalogue and
         recognises most sites on its own, so naming forty of them reads as the
         set it supports — and the reader's own site not being on it reads as
         "not supported" when it very likely is. The step says where to go
         instead, and how to tell within a second of arriving. -->
    <section class="step" data-step="3" hidden>
      <h1 data-i18n="welcomeStep4Title"></h1>
      <p class="lede" data-i18n="welcomeStep4Lede"></p>
      <p class="lede" data-i18n-html="welcomeStep4Lede2"></p>
      <p class="hint" data-i18n="welcomeStep4Hint"></p>

      <div class="actions">
        <button class="ghost" data-go="2" data-i18n="actionBack"></button>
        <button class="primary" id="finish" data-i18n="actionDone"></button>
      </div>
    </section>

  </main>

  <script src="../i18n.js"></script>
  <script src="../send.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
