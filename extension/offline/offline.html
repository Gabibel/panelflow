<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="offlineDocTitle">PanelFlow — Saved chapters</title>
  <!-- The reader is a content script everywhere else; here it is just a script
       on a page of ours. It needs no page to be injected into — it builds its
       own overlay — and this is the only origin from which the saved bytes can
       be read at all. -->
  <link rel="stylesheet" href="../shared/theme.css">
  <!-- Not deferred: the choice has to be on <html> before the first paint. -->
  <script src="../shared/theme.js"></script>
  <link rel="stylesheet" href="../content/reader.css">
  <style>
    /* A bare `[hidden]` loses to any class rule setting display — see popup.css. */
    [hidden] { display: none !important; }
    body { max-width: 720px; margin: 24px auto; font: 14px var(--font-ui); background: var(--bg); color: var(--text); padding: 0 16px; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: 12px; margin: 0 0 18px; }
    .series { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
    .series > h2 { font-size: 14px; margin: 0; padding: 10px 14px; background: var(--surface); display: flex; align-items: center; gap: 10px; }
    .series > h2 .count { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: auto; }
    .chapter { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--line); }
    .chapter .label { flex: 1; }
    .chapter .meta { color: var(--muted); font-size: 12px; }
    .chapter .expiring { color: var(--warn); }
    button { background: var(--accent); color: var(--on-accent); border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
    button.ghost { background: var(--surface-hi); color: var(--text); }
    #empty { color: var(--muted); }
    #empty code { background: var(--surface-hi); border-radius: 4px; padding: 1px 5px; }
  </style>
</head>
<body>
  <h1 data-i18n="popupSavedChapters"></h1>
  <p class="sub" id="usage"></p>
  <div id="list"></div>
  <!-- Carries a <code> around the button it names, so it is placed as markup. -->
  <p id="empty" data-i18n-html="offlineEmpty" hidden></p>

  <script src="../i18n.js"></script>
  <script src="../shared/offline-store.js"></script>
  <script src="../content/reader.js"></script>
  <script src="offline.js"></script>
</body>
</html>
