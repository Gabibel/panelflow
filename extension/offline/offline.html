<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PanelFlow — Saved chapters</title>
  <!-- The reader is a content script everywhere else; here it is just a script
       on a page of ours. It needs no page to be injected into — it builds its
       own overlay — and this is the only origin from which the saved bytes can
       be read at all. -->
  <link rel="stylesheet" href="../content/reader.css">
  <style>
    /* A bare `[hidden]` loses to any class rule setting display — see popup.css. */
    [hidden] { display: none !important; }
    body { max-width: 720px; margin: 24px auto; font: 14px system-ui, sans-serif; background: #14141c; color: #eee; padding: 0 16px; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .sub { color: #9a9ab0; font-size: 12px; margin: 0 0 18px; }
    .series { border: 1px solid #26263a; border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
    .series > h2 { font-size: 14px; margin: 0; padding: 10px 14px; background: #1b1b28; display: flex; align-items: center; gap: 10px; }
    .series > h2 .count { color: #9a9ab0; font-weight: normal; font-size: 12px; margin-left: auto; }
    .chapter { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-top: 1px solid #26263a; }
    .chapter .label { flex: 1; }
    .chapter .meta { color: #9a9ab0; font-size: 12px; }
    button { background: #7c6cf0; color: #fff; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
    button.ghost { background: #26263a; color: #c9c9d8; }
    #empty { color: #9a9ab0; }
    #empty code { background: #26263a; border-radius: 4px; padding: 1px 5px; }
  </style>
</head>
<body>
  <h1>Saved chapters</h1>
  <p class="sub" id="usage"></p>
  <div id="list"></div>
  <p id="empty" hidden>
    Nothing saved yet. Open a chapter, then press <code>📥</code> in the reader's
    side bar to keep it on this device.
  </p>

  <script src="../shared/offline-store.js"></script>
  <script src="../content/reader.js"></script>
  <script src="offline.js"></script>
</body>
</html>
