<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Painted before any script runs, hence the English fallback inside it. -->
  <title data-i18n="optionsTitle">PanelFlow settings</title>
  <style>
    /* A bare `[hidden]` loses to any class rule setting display — see popup.css. */
    [hidden] { display: none !important; }
    body { max-width: 560px; margin: 24px auto; font: 14px system-ui, sans-serif; background: #14141c; color: #eee; padding: 0 16px 48px; }
    h1 { font-size: 20px; }
    fieldset { border: 1px solid #26263a; border-radius: 8px; margin-bottom: 16px; padding: 12px 16px; }
    legend { padding: 0 6px; color: #9a9ab0; }
    label { display: block; margin: 8px 0 4px; }
    input, select, textarea { width: 100%; box-sizing: border-box; background: #26263a; color: #eee; border: none; border-radius: 5px; padding: 7px 9px; font: inherit; }
    textarea { height: 80px; resize: vertical; }
    button { background: #7c6cf0; color: #fff; border: none; border-radius: 6px; padding: 8px 14px; margin-top: 10px; cursor: pointer; font: inherit; }
    button.quiet { background: #26263a; }
    /* A checkbox is the one control that reads as a line, not a stacked pair. */
    label.check { display: flex; align-items: flex-start; gap: 8px; margin: 10px 0; }
    label.check input { width: auto; margin-top: 2px; }
    /* Fixed, because the settings that save on change are spread down the page
       and a status line at the top would confirm a change nobody can see. */
    #status { position: fixed; right: 16px; bottom: 16px; background: #26263a; color: #6fdc8c; border-radius: 6px; padding: 8px 12px; box-shadow: 0 6px 20px #0008; }
    #status:empty { display: none; }
    .hint { font-size: 12px; color: #9a9ab0; margin: 4px 0 0; }
    .hint a { color: #a99df5; }
    details { border: 1px solid #26263a; border-radius: 8px; padding: 8px 16px; }
    summary { color: #9a9ab0; cursor: pointer; }
  </style>
</head>
<body>
  <h1 data-i18n="optionsTitle"></h1>

  <fieldset>
    <legend data-i18n="optionsAccountLegend"></legend>
    <div id="signed-out">
      <p class="hint" data-i18n="optionsAccountHint"></p>
      <label><span data-i18n="fieldEmail"></span> <input id="email" type="email" autocomplete="username"></label>
      <label><span data-i18n="fieldPassword"></span> <input id="password" type="password" autocomplete="current-password"></label>
      <button id="login" data-i18n="actionSignIn"></button>
      <button id="register" class="quiet" data-i18n="actionCreateAccount"></button>
      <p id="auth-msg" class="hint" hidden></p>
      <!-- Drawn only once the backend has said it can send the mail. -->
      <p class="hint" id="forgot-line" hidden><a href="#" id="forgot" data-i18n="optionsForgotPassword"></a></p>
    </div>
    <div id="signed-in" hidden>
      <p><span data-i18n="signedInAs"></span> <b id="who"></b></p>
      <button id="sync" data-i18n="optionsSyncNow"></button>
      <button id="logout" class="quiet" data-i18n="actionSignOut"></button>
    </div>
  </fieldset>

  <fieldset>
    <legend data-i18n="fieldLanguage"></legend>
    <label><span data-i18n="optionsUiLanguage"></span>
      <select id="uiLang">
        <!-- Each language is named in itself; only "follow the browser" is a
             sentence, and it is the one the reader can already read. -->
        <option value="auto" data-i18n="optionsLanguageAuto"></option>
        <option value="en">English</option>
        <option value="fr">Français</option>
      </select>
    </label>
    <p class="hint" data-i18n="optionsLanguageHint"></p>
  </fieldset>

  <fieldset>
    <legend data-i18n="optionsReaderLegend"></legend>
    <label><span data-i18n="optionsDefaultMode"></span>
      <select id="readerMode">
        <option value="vertical" data-i18n="modeVertical"></option>
        <option value="ltr" data-i18n="modeLtr"></option>
        <option value="rtl" data-i18n="modeRtl"></option>
        <option value="spread" data-i18n="modeSpread"></option>
        <!-- The reader has five modes; this list used to have four, so a reader
             left in double-page manga order showed up here as a blank select. -->
        <option value="spread-rtl" data-i18n="modeSpreadRtl"></option>
      </select>
    </label>
    <p class="hint" data-i18n="optionsReaderHint"></p>

    <label class="check"><input type="checkbox" id="autoShow"><span data-i18n="optionsAutoShow"></span></label>
    <label class="check"><input type="checkbox" id="autoNext"><span data-i18n="optionsAutoNext"></span></label>
    <label class="check"><input type="checkbox" id="hideRead"><span data-i18n="optionsHideRead"></span></label>

    <label><span data-i18n="optionsTapZones"></span>
      <select id="tapZones">
        <option value="sides" data-i18n="optionsTapSides"></option>
        <option value="edges" data-i18n="optionsTapEdges"></option>
        <option value="off" data-i18n="optionsTapOff"></option>
      </select>
    </label>
    <p class="hint" data-i18n="optionsTapHint"></p>
  </fieldset>

  <fieldset>
    <legend data-i18n="optionsUpdatesLegend"></legend>
    <label><span data-i18n="optionsCheckEvery"></span>
      <select id="checkInterval">
        <option value="60" data-i18n="optionsEvery1h"></option>
        <option value="180" data-i18n="optionsEvery3h"></option>
        <option value="360" data-i18n="optionsEvery6h"></option>
        <option value="720" data-i18n="optionsEvery12h"></option>
        <option value="1440" data-i18n="optionsEvery24h"></option>
      </select>
    </label>
    <p class="hint" data-i18n="optionsUpdatesHint"></p>
  </fieldset>

  <fieldset>
    <legend data-i18n="optionsAdblockLegend"></legend>
    <label><span data-i18n="optionsWhitelistLabel"></span>
      <textarea id="whitelist" placeholder="example.com"></textarea>
    </label>
    <p class="hint" data-i18n="optionsAdblockHint"></p>
  </fieldset>

  <details>
    <summary data-i18n="optionsAdvancedLegend"></summary>
    <label><span data-i18n="optionsApiUrl"></span> <input id="backendUrl" placeholder="https://panelflow-backend.vercel.app"></label>
    <p class="hint" data-i18n-html="optionsBackendHint"></p>
    <p class="hint" data-i18n-html="optionsReplayHint"></p>
  </details>

  <p id="status" role="status" aria-live="polite"></p>
  <script src="../i18n.js"></script>
  <script src="../send.js"></script>
  <script src="options.js"></script>
</body>
</html>
