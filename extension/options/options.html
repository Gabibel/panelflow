<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Painted before any script runs, hence the English fallback inside it. -->
  <title data-i18n="optionsTitle">PanelFlow settings</title>
  <style>
    /* A bare `[hidden]` loses to any class rule setting display — see popup.css. */
    [hidden] { display: none !important; }
    body { max-width: 560px; margin: 24px auto; font: 14px system-ui, sans-serif; background: #14141c; color: #eee; padding: 0 16px; }
    h1 { font-size: 20px; }
    fieldset { border: 1px solid #26263a; border-radius: 8px; margin-bottom: 16px; padding: 12px 16px; }
    legend { padding: 0 6px; color: #9a9ab0; }
    label { display: block; margin: 8px 0 4px; }
    input, select, textarea { width: 100%; box-sizing: border-box; background: #26263a; color: #eee; border: none; border-radius: 5px; padding: 7px 9px; font: inherit; }
    textarea { height: 80px; resize: vertical; }
    button { background: #7c6cf0; color: #fff; border: none; border-radius: 6px; padding: 8px 14px; margin-top: 10px; cursor: pointer; font: inherit; }
    #status { margin-left: 10px; color: #6fdc8c; }
    .hint { font-size: 12px; color: #9a9ab0; }
    .hint a { color: #a99df5; }
  </style>
</head>
<body>
  <h1 data-i18n="optionsTitle"></h1>

  <fieldset>
    <legend data-i18n="optionsAccountLegend"></legend>
    <div id="signed-out">
      <label><span data-i18n="fieldEmail"></span> <input id="email" type="email"></label>
      <label><span data-i18n="fieldPassword"></span> <input id="password" type="password"></label>
      <button id="login" data-i18n="actionSignIn"></button>
      <button id="register" data-i18n="actionCreateAccount"></button>
      <!-- Drawn only once the backend has said it can send the mail. -->
      <p class="hint" id="forgot-line" hidden><a href="#" id="forgot" data-i18n="optionsForgotPassword"></a></p>
    </div>
    <div id="signed-in" hidden>
      <p><span data-i18n="signedInAs"></span> <b id="who"></b></p>
      <button id="logout" data-i18n="actionSignOut"></button>
    </div>
  </fieldset>

  <fieldset>
    <legend data-i18n="optionsBackendLegend"></legend>
    <label><span data-i18n="optionsApiUrl"></span> <input id="backendUrl" placeholder="https://panelflow-backend.vercel.app"></label>
    <p class="hint" data-i18n-html="optionsBackendHint"></p>
  </fieldset>

  <fieldset>
    <legend data-i18n="optionsReaderLegend"></legend>
    <label><span data-i18n="optionsDefaultMode"></span>
      <select id="readerMode">
        <option value="vertical" data-i18n="modeVertical"></option>
        <option value="ltr" data-i18n="modeLtr"></option>
        <option value="rtl" data-i18n="modeRtl"></option>
        <option value="spread" data-i18n="modeSpread"></option>
        <!-- The reader has five modes; this list used to have four, so a reader
             left in double-page manga order showed up here as a blank select. -->
        <option value="spread-rtl" data-i18n="modeSpreadRtl"></option>
      </select>
    </label>
    <p class="hint" data-i18n="optionsReaderHint"></p>
  </fieldset>

  <fieldset>
    <legend data-i18n="optionsAdblockLegend"></legend>
    <label><span data-i18n="optionsWhitelistLabel"></span>
      <textarea id="whitelist" placeholder="example.com"></textarea>
    </label>
    <p class="hint" data-i18n="optionsAdblockHint"></p>
  </fieldset>

  <button id="save" data-i18n="actionSave"></button><span id="status"></span>
  <p class="hint" data-i18n-html="optionsReplayHint"></p>
  <script src="../i18n.js"></script>
  <script src="../send.js"></script>
  <script src="options.js"></script>
</body>
</html>
