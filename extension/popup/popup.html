<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../shared/theme.css">
  <!-- Not deferred: the choice has to be on <html> before the first paint. -->
  <script src="../shared/theme.js"></script>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="../icons/icon48.png" alt="" width="20" height="20">
      <span>PanelFlow</span>
    </div>
    <span id="account"></span>
  </header>

  <!-- Three lines, the first time this window is opened.
       The setup tour opens in a tab on install, and a tab opened by an
       extension is a tab a lot of people close before it has said anything --
       so the first thing they see of PanelFlow is this menu, with no
       explanation of what it belongs to. These three lines are that
       explanation: what it does, where the button is, and that no account is
       needed. Dismissed by hand rather than after one look, because a card that
       disappears on its own has to be read the moment it appears. -->
  <section id="intro" hidden>
    <p data-i18n="popupIntroWhat"></p>
    <p data-i18n-html="popupIntroWhere"></p>
    <p data-i18n-html="popupIntroAccount"></p>
    <button id="intro-dismiss" data-i18n="popupIntroDismiss"></button>
  </section>

  <!-- Primary actions: one tap each, always in the same place. -->
  <nav class="menu">
    <button class="menu-item" id="open-app">
      <svg class="ico" viewBox="0 0 24 24"><path d="M4 5h16v14H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M4 9h16" stroke="currentColor" stroke-width="2"/></svg>
      <span class="label" data-i18n="popupOpenApp"></span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button class="menu-item" id="open-sites">
      <svg class="ico" viewBox="0 0 24 24"><path d="M4 6h10M4 12h16M4 18h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="label" data-i18n="popupCompatibleSites"></span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button class="menu-item" id="open-stats">
      <svg class="ico" viewBox="0 0 24 24"><path d="M5 20v-7M12 20V4M19 20v-10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="label" data-i18n="popupReadingStats"></span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button class="menu-item" id="open-trackers">
      <svg class="ico" viewBox="0 0 24 24"><path d="M9 12l2 2 4-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span class="label" data-i18n="popupTrackers"></span>
      <!-- Empty unless a tracker has refused a chapter. A push happens while
           the reader is reading and its answer is seen by nobody, so this is
           the only place a dead connection ever announces itself. -->
      <span class="count alert" id="tracker-alert"></span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button class="menu-item" id="open-offline">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 3v10m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label" data-i18n="popupSavedChapters"></span>
      <span class="count" id="offline-count"></span>
    </button>

    <button class="menu-item" id="add-current">
      <svg class="ico" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span class="label" data-i18n="popupAddToLibrary"></span>
    </button>

    <button class="menu-item" id="toggle-reader">
      <svg class="ico" viewBox="0 0 24 24"><path d="M3 5h7a2 2 0 012 2v12a3 3 0 00-3-3H3zM21 5h-7a2 2 0 00-2 2v12a3 3 0 013-3h6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span class="label" data-i18n="popupShowReader"></span>
      <kbd>Alt+R</kbd>
    </button>

    <button class="menu-item" id="report">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v6M12 16.5v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="label" data-i18n="popupReportIssue"></span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </nav>

  <!-- Why the rows above are greyed out, when they are. Actionable when the
       user can do something about it — see PAGE_STATE in popup.js. -->
  <button id="page-state" hidden></button>

  <p id="toast" hidden></p>

  <section class="group" data-group="library">
    <button class="group-head">
      <span data-i18n="popupGroupLibrary"></span>
      <svg class="caret" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="group-body">
      <input id="search" type="search" data-i18n-placeholder="popupSearchLibrary" hidden>
      <!-- Same row as the web app's, folded into the width of a popup: the
           order, one tag at a time, and the only filter worth a tap here. -->
      <div class="lib-tools" id="lib-tools" hidden>
        <select id="sort" data-i18n-title="popupSortOrder"></select>
        <button id="sort-dir" data-i18n-title="popupReverseOrder"></button>
        <select id="tag-filter" data-i18n-title="popupOnlyOneTag"></select>
        <button id="unread-only" aria-pressed="false"
                data-i18n-title="popupUnreadTitle" data-i18n="popupUnread"></button>
      </div>
      <div id="library-list"></div>
      <p class="empty" id="library-empty" data-i18n="popupLibraryEmpty"></p>
    </div>
  </section>

  <section class="group" data-group="recent">
    <button class="group-head">
      <span data-i18n="popupGroupRecent"></span>
      <svg class="caret" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="group-body">
      <div id="recent-list"></div>
      <p class="empty" id="recent-empty" data-i18n="popupNothingRead"></p>
    </div>
  </section>

  <section class="group" data-group="defaults">
    <button class="group-head">
      <span data-i18n="popupGroupDefaults"></span>
      <svg class="caret" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="group-body">
      <div class="setting">
        <span data-i18n="popupAutoShowReader"></span>
        <div class="switcher" id="default-autoshow" role="group">
          <button data-value="on" data-i18n="switchOn"></button>
          <button data-value="off" data-i18n="switchOff"></button>
        </div>
      </div>
    </div>
  </section>

  <section class="group" data-group="site" id="site-group" hidden>
    <button class="group-head">
      <span id="site-host"></span>
      <svg class="caret" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="group-body">
      <div class="setting">
        <span data-i18n="popupAutoShowReader"></span>
        <div class="switcher" id="site-autoshow" role="group">
          <button data-value="on" data-i18n="switchOn"></button>
          <button data-value="off" data-i18n="switchOff"></button>
          <button data-value="default" data-i18n="switchDefault"></button>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <button id="check-now" data-i18n="popupCheckNow"></button>
    <a href="#" id="open-options" data-i18n="popupSettings"></a>
  </footer>

  <!-- Entry detail. Built in JS from the selected library entry. -->
  <div class="panel" id="entry-panel" hidden>
    <div class="panel-head">
      <button class="panel-back" id="entry-back" data-i18n-title="actionBack">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span data-i18n="popupPanelInfo"></span>
    </div>
    <div id="entry-body"></div>
    <div class="entry-actions">
      <button id="entry-chapters">
        <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="popupChapters"></span>
      </button>
      <button id="entry-resume" class="primary"></button>
    </div>
  </div>

  <!-- Slides over the menu; ← returns. -->
  <div class="panel" id="sites-panel" hidden>
    <div class="panel-head">
      <button class="panel-back" id="sites-back" data-i18n-title="actionBack">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span data-i18n="popupCompatibleSites"></span>
    </div>
    <input id="sites-search" type="search" data-i18n-placeholder="popupSearchSites">
    <p class="empty" data-i18n="popupSitesLede"></p>
    <div id="sites-list"></div>
    <p class="empty" id="sites-none" data-i18n="popupNoMatch" hidden></p>
  </div>

  <!-- Statistics come from the account (it holds every device's reads); the
       log below is this device's own copy, so it is there while signed out. -->
  <div class="panel" id="stats-panel" hidden>
    <div class="panel-head">
      <button class="panel-back" id="stats-back" data-i18n-title="actionBack">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span data-i18n="popupReadingStats"></span>
    </div>
    <p class="empty" id="stats-note" hidden></p>
    <div class="stat-cards" id="stat-cards"></div>
    <div class="panel-sub" id="stat-chart-head" data-i18n="popupLast30Days" hidden></div>
    <div class="chart" id="stat-chart"></div>
    <div class="panel-sub" id="stat-top-head" data-i18n="popupMostRead" hidden></div>
    <div class="top-list" id="stat-top"></div>
    <div class="panel-sub" data-i18n="popupReadingLog"></div>
    <div class="log" id="stat-log"></div>
    <p class="empty" id="stat-log-empty" data-i18n="popupNothingRead" hidden></p>
  </div>
  <!-- Trackers: the accounts progress is sent to, and what has been matched to
       what. Connecting opens a tab — an OAuth page cannot live in a popup that
       closes the moment focus leaves it. -->
  <div class="panel" id="trackers-panel" hidden>
    <div class="panel-head">
      <button class="panel-back" id="trackers-back" data-i18n-title="actionBack">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span data-i18n="popupTrackers"></span>
    </div>
    <p class="empty" id="trackers-note" hidden></p>
    <div id="tracker-accounts"></div>
    <div class="panel-sub" id="tracker-links-head" data-i18n="popupLinkedSeries" hidden></div>
    <div id="tracker-links"></div>
  </div>

  <!-- Picking the right series on a tracker by hand. -->
  <div class="panel" id="link-panel" hidden>
    <div class="panel-head">
      <button class="panel-back" id="link-back" data-i18n-title="actionBack">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span id="link-title" data-i18n="popupFindOnTracker"></span>
    </div>
    <input id="link-query" type="search" data-i18n-placeholder="popupSearchTracker">
    <p class="empty" id="link-note" hidden></p>
    <div id="link-results"></div>
    <div class="entry-actions">
      <button id="link-mute" data-i18n="popupNeverSend"></button>
      <button id="link-search" class="primary" data-i18n="actionSearch"></button>
    </div>
  </div>

  <!-- Generated from shared/ — the shelf is ordered and narrowed by the same
       rule here and in the web app (library-view.js), and a folder means the
       same thing in both (folders.js). -->
  <script src="../i18n.js"></script>
  <script src="../send.js"></script>
  <script src="../shared/folders.js"></script>
  <script src="../shared/library-view.js"></script>
  <script src="popup.js"></script>
</body>
</html>
